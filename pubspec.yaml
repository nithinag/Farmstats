
name: farmstats
description: "FarmOS - Offline-First Smart Sericulture Farm Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: any
  cupertino_icons: ^1.0.8
  go_router: any
  drift: any
  sqlite3_flutter_libs: any
  path_provider: any
  path: any
  google_fonts: any
  intl: any
  uuid: any
  shared_preferences: any
  flutter_secure_storage: any
  fl_chart: any
  freezed_annotation: any
  json_annotation: any
  sqlite3: ^3.5.0
  fpdart: ^1.2.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  csv: ^8.0.0
  pdf: ^3.12.0
  permission_handler: ^12.0.3
  printing: ^5.14.3
  flutter_dynamic_icon_plus: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  drift_dev: any
  freezed: any
  json_serializable: any
